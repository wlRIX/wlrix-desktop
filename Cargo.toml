[package]
name = "wlrix-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX desktop icons — the Indigo Magic desktop for the files in your XDG desktop directory."
repository = "https://github.com/wlrix/wlrix-desktop"
publish = false

[dependencies]
# The Wayland client. `wlrix-desktop` is a wlr-layer-shell **background** surface, drawn into
# a plain shm buffer -- the same shape as wlrix-greeter, whose `ui` module this follows.
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# The event loop. Wayland events, the inotify watch on the desktop directory, and the
# deferred state save are all sources on one loop.
calloop = "0.13"
# The shared UI crate: the canvas, the Motif bevel, the fonts, the coverage mask, the image
# decoder and the palette. Pinned by rev rather than taken by path, so this repo still builds
# from a fresh standalone clone -- the same shape as the smithay pin in `wlrix-compositor`.
# `just link-ui` in `wlrix-epoch` patches in a sibling checkout while working on both sides.
#
# `image` is not in its default features: it pulls resvg, which only this component needs.
wlrix-ui = { git = "https://github.com/wlRIX/wlrix-ui", rev = "33c693db461331cf183fb4e5090fb5c6be71a6f5", features = ["image"] }
# `fs::inotify` for watching the desktop directory. Already in the dependency tree via
# calloop and smithay-client-toolkit, so this costs nothing new.
rustix = { version = "1", features = ["fs"] }
# The config file and the machine-written icon-position state. TOML is wlRIX's config
# format throughout.
serde = { version = "1", features = ["derive"] }
toml = "1"
libc = "0.2"
# Resolving an `Icon=` name to a file: index.theme parsing, theme inheritance, size and scale
# directories, and the `/usr/share/pixmaps` fallback. All of that is the icon-theme spec, and
# reimplementing it to get the awkward cases wrong would be a poor trade.
freedesktop-icons = "0.4.0"
# `ext-foreign-toplevel-list-v1`, for knowing which applications have a window open -- which is
# what decides whether a launcher's magic carpet is drawn open or closed. The compositor
# advertises it; smithay-client-toolkit does not wrap it, so the bindings come from here.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
